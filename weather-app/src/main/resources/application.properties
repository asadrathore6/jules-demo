# ===================================================================
# POSTGRESQL DATABASE CONFIGURATION
# ===================================================================
# IMPORTANT: Replace the placeholders below with your actual PostgreSQL connection details.
# The application will not be able to connect to the database until you provide the correct values.

# The JDBC URL of your PostgreSQL database.
# Format: jdbc:postgresql://<host>:<port>/<database_name>
# Example: jdbc:postgresql://localhost:5432/weather_app_db
spring.datasource.url=jdbc:postgresql://localhost:5432/weatherdb

# The username for your PostgreSQL database.
spring.datasource.username=postgres

# The password for your PostgreSQL database.
spring.datasource.password=password


# ===================================================================
# JPA & HIBERNATE CONFIGURATION
# ===================================================================

# This setting allows Hibernate to automatically create or update the database
# schema based on your @Entity classes when the application starts.
# 'update' is a safe choice for development. It creates tables if they don't exist
# but does not drop them, preserving data between restarts.
spring.jpa.hibernate.ddl-auto=update

# Explicitly setting the dialect is good practice, although Spring Boot can often infer it.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
