databaseChangeLog:
  - changeSet:
      id: 1
      author: jules
      changes:
        - createTable:
            tableName: weather_data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: temperature
                  type: DOUBLE
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: timestamp
                  type: TIMESTAMP
