version: '3.8'

services:
  postgres:
    image: postgres:15.3
    container_name: postgres_db
    environment:
      POSTGRES_DB: weatherdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weatherdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather-app:
    build: .
    container_name: weather_app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=weatherdb
      - DB_USER=postgres
      - DB_PASSWORD=password

volumes:
  postgres-data:
